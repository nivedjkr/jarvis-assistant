# JARVIS Configuration

# NVIDIA NIM API Settings
api:
  base_url: "https://integrate.api.nvidia.com/v1"
  model: "meta/llama-3.1-8b-instruct"
  temperature: 0.6
  max_tokens: 500
  stream: true
  timeout: 60.0

# Memory Settings
memory:
  file: "jarvis/data/jarvis.db"
  log_file: "jarvis_commands.log"

# Tool Settings
tools:
  confirm_dangerous: true
  log_commands: true

# Personality Settings
personality:
  user_title: "sir"  # How JARVIS addresses the user (sir, ma'am, etc.)
  response_style: "concise"  # concise, detailed
  enable_boot_greeting: true  # Speak greeting on startup

# Voice Settings
voice:
  enabled: false
  speak_responses: false  # Output-only TTS for all responses
  speak_code_blocks: false  # Skip reading raw code blocks aloud
  stt_model: "base"  # "base" or "small" for faster-whisper
  tts_engine: "edge"  # "edge" or "pyttsx3"
  tts_voice: "en-GB-RyanNeural"  # Edge TTS voice
  push_to_talk_key: "space"  # Key for push-to-talk
  input_device: null  # Input device ID (null for default, or integer)
  wake_word_enabled: false  # Enable wake word detection
  silence_threshold: 0.5  # Silence detection threshold (0-1)
  auto_stop_recording: true  # Auto-stop on silence

# Global Awareness Settings
awareness:
  enabled: true
  topics:
    - "AI"
    - "cybersecurity"
    - "space technology"
  check_interval_hours: 0.33  # 20 minutes (0.33 hours)
  significance_threshold: 7

# Proactive Assistant Settings
proactive:
  enabled: true
  frequency: 20  # Check interval frequency in minutes
  cooldown_minutes: 30  # Cooldown between proactive suggestions (30 mins default)
  velocity_anomaly_threshold: 1.8  # Threshold ratio for stock velocity anomaly
  idle_threshold_minutes: 10  # Minutes of inactivity before idle commentary
  idle_cooldown_minutes: 15   # Minimum minutes between idle commentary speech
  interests:
    - "AI"
    - "cybersecurity"
    - "space technology"
    - "software engineering"

# Location Settings
location:
  city: "Kerala"
  country: "India"

# GitHub Settings
github:
  default_repo: "nivedjkr/jarvis-assistant"
  watch_repos:
    - "nivedjkr/jarvis-assistant"
  check_interval_minutes: 30

# Obsidian Memory Settings
obsidian:
  enabled: true
  vault_path: "C:/Users/nived/Obsidian/Vault"
  smart_connections_mcp_url: "http://127.0.0.1:3000"
  fallback_to_grep: true

