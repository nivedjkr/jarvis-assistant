# JARVIS Configuration System

api:
  provider: nvidia
  model: nvidia/nemotron-3-ultra-550b-a55b
  base_url: https://integrate.api.nvidia.com/v1
  max_tokens: 500
  max_history_messages: 40
  stream: false

personality:
  user_title: sir
  name: JARVIS
  adaptive_tone: true
  voice_enabled: true
  response_style: concise
  enable_boot_greeting: true

voice:
  tts_engine: edge-tts
  tts_voice: en-GB-RyanNeural
  boot_greeting: true
  speak_responses: true
  speak_code_blocks: false
  max_speak_length: 400
  stt_model: base
  push_to_talk_key: space
  input_device: null
  wake_word_enabled: false
  silence_threshold: 0.5
  auto_stop_recording: true

memory:
  auto_extract: true
  max_facts: 500
  context_facts: 10
  db_path: jarvis/data/jarvis.db
  file: jarvis/data/jarvis.db
  log_file: jarvis_commands.log

github:
  default_repo: nivedjkr/jarvis-assistant
  watch_repos:
    - nivedjkr/jarvis-assistant
  check_interval_minutes: 30

obsidian:
  enabled: true
  vault_path: "D:/OBSIDIAN/NIVED"

trading:
  check_interval_seconds: 300
  default_tickers: []

tools:
  confirm_destructive: true
  confirm_dangerous: true
  app_launch_timeout: 2.0
  command_timeout: 30
  log_commands: true

debug:
  enabled: false
  log_tool_calls: true
  log_api_calls: false
  log_file: jarvis/data/jarvis.log

location:
  city: Kerala
  country: India

awareness:
  enabled: true
  topics:
    - AI
    - cybersecurity
    - space technology
  check_interval_hours: 0.33
  significance_threshold: 7

proactive:
  enabled: true
  frequency: 20
  cooldown_minutes: 30
  velocity_anomaly_threshold: 1.8
  idle_threshold_minutes: 10
  idle_cooldown_minutes: 15
  interests:
    - AI
    - cybersecurity
    - space technology
    - software engineering
