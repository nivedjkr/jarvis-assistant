name: JARVIS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Validate tool schemas
      run: |
        python -c "
        from jarvis.tools import ToolRegistry, validate_tool_schemas
        r = ToolRegistry()
        ok = validate_tool_schemas(r)
        print(f'Tools: {len(r.tools)}')
        assert ok
        "
      env:
        NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
    
    - name: Run tests
      run: pytest jarvis/tests/ -v --tb=short
      env:
        NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Security check
      shell: cmd
      run: |
        git ls-files | findstr /E ".env .db token" >nul 2>&1 && echo FAIL && exit 1 || echo OK
